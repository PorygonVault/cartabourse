name: Collecte quotidienne des annonces eBay

on:
  schedule:
    # 6h00 UTC — décalé d'une heure par rapport à la collecte Cardmarket,
    # pour ne pas faire tourner les deux exécutions en même temps
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # permet aussi un lancement manuel depuis l'onglet Actions

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install requests

      - name: Lancer la collecte
        run: python scripts/import_ebay_listings.py
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_ENV: production
          EBAY_MARKETPLACE: EBAY_FR
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Enregistrer la progression dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/ebay_progress.txt
          git diff --cached --quiet || git commit -m "Mise à jour progression collecte eBay"
          git push
