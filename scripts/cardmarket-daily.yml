name: Collecte quotidienne des prix Cardmarket

on:
  schedule:
    # 5h00 UTC ≈ 6h ou 7h heure française selon l'heure d'été/hiver
    - cron: "0 5 * * *"
  workflow_dispatch: {}   # permet aussi un lancement manuel depuis l'onglet Actions

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer l'identité git
        # Nécessaire AVANT le script : import_cardmarket_prices.py commite et
        # pousse lui-même price_guide_6.json (pour en garder un historique
        # dans le dépôt). Sans ça, ce commit interne échoue silencieusement.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install requests

      - name: Lancer la collecte
        run: python scripts/import_cardmarket_prices.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
